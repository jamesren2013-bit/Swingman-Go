<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swingman Go</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #3b9eff 0%, #52e89c 100%);
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        /* Top Arcade HUD Overlay */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .hud-btn {
            pointer-events: auto;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            border: 3px solid #1e3a5f;
            box-shadow: 0 4px 0 #1e3a5f;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            color: #2563eb;
        }

        .hud-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e3a5f;
        }

        /* Center Level Progress Bar matching reference */
        #progress-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.16);
            padding: 6px 16px;
            border-radius: 999px;
            backdrop-filter: blur(4px);
        }

        .lvl-num {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 2px 0 rgba(15, 23, 42, 0.45);
            min-width: 22px;
            text-align: center;
        }

        #progress-track {
            width: clamp(160px, 34vw, 340px);
            height: 12px;
            background: rgba(30, 41, 59, 0.55);
            border-radius: 999px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 999px;
            transition: width 0.06s linear;
        }

        /* Floating Control Hint Pill */
        #controls-hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.65);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            transition: opacity 0.35s ease;
        }

        /* Modal Overlay for Pause / Crash / Level Clear */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }

        #modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            border: 4px solid #0f172a;
            box-shadow: 0 10px 0 #0f172a;
            border-radius: 24px;
            padding: 28px 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .modal-sub {
            font-size: 16px;
            color: #475569;
            margin-bottom: 22px;
        }

        .modal-btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 16px;
            border: 3px solid #0f172a;
            box-shadow: 0 5px 0 #0f172a;
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            font-family: inherit;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .modal-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f172a;
        }

        .modal-btn.green {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Minimalist Top HUD -->
    <div id="hud">
        <button id="pauseBtn" class="hud-btn" aria-label="Pause">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
                <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
            </svg>
        </button>

        <div id="progress-wrapper">
            <span id="currLvlText" class="lvl-num">1</span>
            <div id="progress-track">
                <div id="progress-fill"></div>
            </div>
            <span id="nextLvlText" class="lvl-num">2</span>
        </div>

        <button id="muteBtn" class="hud-btn" aria-label="Toggle Sound">
            <svg id="soundIconOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg id="soundIconOff" style="display:none" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#ef4444"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
        </button>
    </div>

    <div id="controls-hint">A/D: Run • W: Jump • S: Crouch/Drop • Hold Click / E / Shift: Swing!</div>

    <!-- Game State Modal -->
    <div id="modal-overlay">
        <div class="modal-card">
            <div id="modalTitle" class="modal-title">LEVEL COMPLETE!</div>
            <div id="modalSub" class="modal-sub">Awesome swing! Ready for the next course?</div>
            <button id="modalActionBtn" class="modal-btn green">NEXT LEVEL</button>
        </div>
    </div>

    <script>
        (() => {
            'use strict';

            // --------------------------------------------------------------------
            // 1. HIGH-DPI CANVAS & VIEWPORT SETUP
            // --------------------------------------------------------------------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            let viewW = window.innerWidth;
            let viewH = window.innerHeight;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            function resizeCanvas() {
                viewW = window.innerWidth;
                viewH = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(viewW * dpr);
                canvas.height = Math.floor(viewH * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // --------------------------------------------------------------------
            // 2. PROCEDURAL WEB AUDIO SYNTHESIZER (ZERO EXTERNAL ASSETS)
            // --------------------------------------------------------------------
            class SoundEngine {
                constructor() {
                    this.ctx = null;
                    this.muted = false;
                }

                init() {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                }

                toggleMute() {
                    this.muted = !this.muted;
                    return this.muted;
                }

                playGrapple() {
                    if (this.muted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(290, now);
                    osc.frequency.exponentialRampToValueAtTime(760, now + 0.09);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }

                playRelease() {
                    if (this.muted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(480, now);
                    osc.frequency.exponentialRampToValueAtTime(190, now + 0.11);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.13);
                }

                playJump() {
                    if (this.muted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.14);
                }

                playBumper() {
                    if (this.muted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(640, now + 0.18);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.21);
                }

                playCrash() {
                    if (this.muted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(175, now);
                    osc.frequency.exponentialRampToValueAtTime(48, now + 0.28);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.31);
                }

                playWin() {
                    if (this.muted || !this.ctx) return;
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const now = this.ctx.currentTime + idx * 0.085;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.36);
                    });
                }

                playBoostRing() {
                    if (this.muted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(340, now);
                    osc.frequency.exponentialRampToValueAtTime(1180, now + 0.22);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }

                playGlassShatter() {
                    if (this.muted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    [1250, 1680, 2140].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.02);
                        osc.frequency.exponentialRampToValueAtTime(420, now + idx * 0.02 + 0.09);
                        gain.gain.setValueAtTime(0.12, now + idx * 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.02 + 0.1);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.02);
                        osc.stop(now + idx * 0.02 + 0.11);
                    });
                }
            }
            const sfx = new SoundEngine();

            // --------------------------------------------------------------------
            // 3. ZERO-ALLOCATION OBJECT POOLS (PARTICLES & RIBBON TRAIL)
            // --------------------------------------------------------------------
            const PARTICLE_POOL_SIZE = 320;
            const particlePool = Array.from({ length: PARTICLE_POOL_SIZE }, () => ({
                active: false,
                x: 0,
                y: 0,
                vx: 0,
                vy: 0,
                size: 5,
                color: '#ffffff',
                alpha: 1,
                life: 0,
                maxLife: 1,
                gravity: 0,
                shape: 'circle',
                rot: 0,
                vRot: 0
            }));

            function spawnParticle(x, y, vx, vy, size, color, maxLife, gravity = 0, shape = 'circle') {
                for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
                    const p = particlePool[i];
                    if (!p.active) {
                        p.active = true;
                        p.x = x;
                        p.y = y;
                        p.vx = vx;
                        p.vy = vy;
                        p.size = size;
                        p.color = color;
                        p.alpha = 1;
                        p.life = 0;
                        p.maxLife = maxLife;
                        p.gravity = gravity;
                        p.shape = shape;
                        p.rot = Math.random() * Math.PI * 2;
                        p.vRot = (Math.random() - 0.5) * 12;
                        return;
                    }
                }
            }

            // Pre-allocated ring buffer for the stickman's cyan speed ribbon
            const TRAIL_MAX = 30;
            const trailPool = Array.from({ length: TRAIL_MAX }, () => ({ x: 0, y: 0, active: false }));
            let trailHead = 0;
            let trailTimer = 0;

            function resetTrail() {
                for (let i = 0; i < TRAIL_MAX; i++) {
                    trailPool[i].active = false;
                }
                trailHead = 0;
            }

            function pushTrailPoint(x, y) {
                trailPool[trailHead].x = x;
                trailPool[trailHead].y = y;
                trailPool[trailHead].active = true;
                trailHead = (trailHead + 1) % TRAIL_MAX;
            }

            // --------------------------------------------------------------------
            // 4. EXPANDED EPIC LEVEL BLUEPRINTS & PROCEDURAL COURSE GENERATOR
            // --------------------------------------------------------------------
            const HANDCRAFTED_LEVELS = [
                {
                    // Level 1 (Extended 5,650px): Grass start -> swings -> Boost Ring -> Bouncy Pad -> Buzzsaw -> Glass Wall -> Finish
                    startPlatform: { x: -160, y: 80, w: 480, h: 42 },
                    finishX: 5650,
                    abyssY: 600,
                    anchors: [
                        { x: 440, y: -230, radius: 560 },
                        { x: 1020, y: -265, radius: 560 },
                        { x: 1650, y: -250, radius: 560 },

                    ],

                    ],
                    bumpers: [
                        { x: 750, y: 65, r: 32, bounce: 1000, color: '#f1c40f' },

                    ],

                    ],

                        { x: 4080, y: -40, r: 42, angle: 0, moveAxis: 'y', moveAmp: 95, moveSpeed: 2.8, phase: 1.2 }
                    ],
                    boostRings: [
                        { x: 1980, y: -110, r: 48, angle: -0.22, boostSpeed: 1580, cooldown: 0 },

                    ],
                    laserGates: [

                    ],
                    glassWalls: [

                },
                {
                    // Level 2 (Extended 7,450px): Moving pendulums, twin laser corridors, orbital buzzsaws & chained boost rings

                    finishX: 7450,

                    ],
                    platforms: [

                    ],

                    ],
                    spikes: [

                    ],
                    boostRings: [
                        { x: 1040, y: -75, r: 48, angle: -0.2, boostSpeed: 1620, cooldown: 0 },
                        { x: 2820, y: -125, r: 48, angle: -0.24, boostSpeed: 1680, cooldown: 0 },

                    ],
                    laserGates: [
